name: Image

# Build and publish the control-plane container image to GHCR on release.
#
# It chains off the "Release" workflow via workflow_run: the Release workflow cuts a
# GitHub Release (and tag) on every push to main, and this runs right after it
# succeeds, building the exact commit that was released. (A release created by the
# workflow's GITHUB_TOKEN does NOT fire a `release:` event — GitHub's recursion guard
# — so workflow_run is the reliable chain.) workflow_dispatch allows a manual rebuild.
#
# The image bundles ironclaw-controlplane + ironctl (container/controlplane.Dockerfile);
# docker-compose.yml and the README pull it from ghcr.io/<owner>/ironclaw-controlplane.
#
# Multi-arch (linux/amd64 + linux/arm64): the image embeds a CGO (SQLCipher) binary, so
# each arch is built NATIVELY on its own GitHub-hosted runner (ubuntu-latest for amd64,
# ubuntu-24.04-arm for arm64) rather than under QEMU emulation, which is slow and flaky
# for CGO. Each arch is pushed to GHCR by digest (no tag), then a final `merge` job
# stitches the per-arch digests into one manifest list under the real tags and attaches
# build provenance to the index digest.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to stamp + publish (e.g. v0.1.99). Must point at the commit this run builds, or the run fails. Blank = auto-detect this commit's tag."
        required: false
        default: ""
      publish_mcp_registry:
        description: "Also (re-)publish the MCP Registry listing on this manual run. The release path publishes automatically; this only matters for a dispatch."
        type: boolean
        required: false
        default: false

# Least privilege by default: the workflow token is read-only at the top level.
# The write scopes (packages / id-token / attestations) are granted only to the
# specific jobs that push to GHCR and sign/attest the image — see each job below.
permissions:
  contents: read

# Serialize image publishes so two builds never race the :latest tag.
concurrency:
  group: image
  cancel-in-progress: false

jobs:
  # Resolve the lowercased GHCR ref + the version to tag with, once, so the per-arch
  # build matrix and the merge job all agree. The version is the git tag the Release
  # workflow put on THIS commit (so the image tag always matches the built commit's
  # release — no formula duplication, no latest-release race); a manual dispatch may
  # override it. Blank version → publish :latest only. A commit with no
  # container/controlplane.Dockerfile (older release chaining in, or a revert) yields
  # present=false and the build/merge jobs skip cleanly — "nothing to publish", not a
  # failure.
  prepare:
    runs-on: ubuntu-latest
    # On the workflow_run path, admit a Release run that either SUCCEEDED or FAILED, and
    # decide per-JOB below whether the failure actually concerns the image. Keying off the
    # aggregate `conclusion == 'success'` made every job in Release a hard gate on the
    # whole publish chain — so a flaky `formula` step (a cosmetic Homebrew bump that runs
    # long after the release is cut and verified) silently skipped the control-plane
    # image, `ironclaw-mcp`, their provenance/SBOM attestations, and the MCP Registry
    # publish, with no red anywhere obvious (IRO-621). Cancelled/skipped Release runs are
    # still refused here — only a real success or a real failure gets to the job gate.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    permissions:
      contents: read # read-only API lookups + trust-gate; no push/sign here
      actions: read # read the upstream Release run's per-job conclusions (gate below)
    outputs:
      present: ${{ steps.meta.outputs.present }}
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      tag_args: ${{ steps.meta.outputs.tag_args }}
      # The tag NAMES this run publishes, space-separated (e.g. "latest v0.1.411").
      # Single source of truth for every downstream step that has to name a tag; nothing
      # below may hardcode `latest`, which is conditional since IRO-625.
      tags: ${{ steps.meta.outputs.tags }}
      sha: ${{ steps.meta.outputs.sha }}
      mcp_present: ${{ steps.meta.outputs.mcp_present }}
      mcp_image: ${{ steps.meta.outputs.mcp_image }}
      mcp_tags: ${{ steps.meta.outputs.mcp_tags }}
    steps:
      # Blast-radius gate (IRO-621). The Release run FAILED — work out whether anything
      # the image chain actually depends on is what failed.
      #
      # Fail-closed by default: every Release job is treated as blocking unless it is
      # named in ADVISORY below. Advisory jobs are post-release bookkeeping that runs
      # AFTER the release is published, smoke-tested and signed, and whose output the
      # image does not consume:
      #
      #   formula — regenerates Formula/ironclaw.rb from the already-published, already-
      #             signed SHA256SUMS and opens the rolling `brew/track` PR. Cosmetic
      #             packaging metadata. It still fails LOUD in Release (it is not
      #             continue-on-error, and its manual runbook still lands in the job
      #             summary); it simply no longer suppresses a security-critical publish.
      #
      # Everything else — version, build, release, containment-report, smoke,
      # smoke_windows — stays blocking: those either produce the artifacts the image is
      # built alongside or are the yank signals for a bad release, and publishing an
      # image from a release that failed them would be publishing a green lie.
      #
      # Matrix jobs report as "smoke (ubuntu-latest, ...)", so match on the base name
      # before the " (" suffix.
      #
      # Read `status` alongside `conclusion` and treat anything that is not
      # `status=completed` as blocking (IRO-626). A queued/in-progress job reports
      # `conclusion: null`, and a null must never be read as a pass: this step only runs
      # for a `completed` Release run, so a job that is still not completed means the
      # jobs API is lagging the workflow_run event rather than that the job was fine.
      # Passing on null would be fail-OPEN in exactly the eventual-consistency window
      # this gate exists to survive — an image published off a release whose `smoke` we
      # never actually observed pass. Jobs that legitimately never ran come back
      # `status=completed, conclusion=skipped`, which still passes.
      - name: Gate on the Release jobs the image actually depends on
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' }}
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ADVISORY="formula"

          jobs_tsv="$(gh api --paginate "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | [(.name | split(" (")[0]), (.status | tostring), (.conclusion | tostring)] | @tsv')"

          if [ -z "${jobs_tsv}" ]; then
            echo "::error::Could not read the job list for Release run ${RUN_ID} (${RUN_URL}) — refusing to publish an image off an unverified run." >&2
            exit 1
          fi

          blocking=""
          while IFS="$(printf '\t')" read -r jname jstatus jconc; do
            [ -n "${jname}" ] || continue

            # Advisory jobs are exempt outright — the image consumes nothing they produce,
            # so neither their conclusion nor their status can veto the publish.
            case " ${ADVISORY} " in
              *" ${jname} "*)
                case "${jstatus}:${jconc}" in
                  completed:success | completed:skipped | completed:neutral) ;;
                  *)
                    echo "::warning title=Advisory Release job did not pass::'${jname}' ended ${jstatus}/${jconc} in the upstream Release run, but it is post-release bookkeeping the image does not depend on — continuing with the image publish (IRO-621). Fix it on its own ticket: ${RUN_URL}"
                    ;;
                esac
                continue
                ;;
            esac

            if [ "${jstatus}" != "completed" ]; then
              blocking="${blocking}${blocking:+, }${jname}=${jstatus}/not-completed"
              continue
            fi
            case "${jconc}" in
              success | skipped | neutral) continue ;;
            esac
            blocking="${blocking}${blocking:+, }${jname}=${jconc}"
          done <<EOF
          ${jobs_tsv}
          EOF

          if [ -n "${blocking}" ]; then
            echo "::error title=A Release job the image depends on did not pass::Refusing to publish: ${blocking}. See ${RUN_URL}." >&2
            exit 1
          fi
          echo "Release run ${RUN_ID} failed only advisory jobs — the image chain is unaffected, proceeding."

      # SECURITY (Dangerous-Workflow / "pwn request"): this workflow runs in a
      # privileged context (the build/merge jobs hold packages + attestations write),
      # so it must NEVER `actions/checkout` the event-supplied head_sha — that is the
      # attacker-controllable ref a forked PR could smuggle in. Instead we resolve all
      # metadata over the read-only API and TRUST-GATE the commit here; the build job
      # checks out the SHA this job emits (`needs.prepare.outputs.sha`), never the raw
      # event variable. The gate proves the commit actually lives on the protected
      # default branch (Release only runs on push-to-main), so a privileged build can
      # only ever run on trusted, branch-protected code.
      - name: Resolve + trust-gate the commit, image ref, and version
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DISPATCH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          default_branch="${DEFAULT_BRANCH:-main}"

          # 1) Resolve the commit to build and trust-gate it. A manual dispatch runs on a
          #    ref only a repo-writer could have selected, so its commit (github.sha) is
          #    trusted as-is. On the workflow_run path the SHA comes from the event and is
          #    treated as untrusted until proven to live on the protected branch: it must
          #    have been pushed to ${default_branch} AND be reachable from that branch's
          #    tip. Anything else (e.g. a fork PR head) is refused — fail loud, fail closed.
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            sha="${DISPATCH_SHA}"
          else
            sha="${RUN_SHA}"
            if [ "${RUN_BRANCH}" != "${default_branch}" ]; then
              echo "::error::Release ran on '${RUN_BRANCH}', not the protected '${default_branch}' branch — refusing to build a privileged image from an untrusted ref." >&2
              exit 1
            fi
            status="$(gh api "repos/${REPO}/compare/${default_branch}...${sha}" --jq '.status')"
            case "${status}" in
              identical|behind) : ;; # sha is the branch tip or an ancestor of it → on-branch, trusted
              *)
                echo "::error::Commit ${sha} is not reachable from '${default_branch}' (compare status: ${status}) — refusing to build a privileged image from an untrusted ref." >&2
                exit 1
                ;;
            esac
          fi
          echo "Trusted build commit: ${sha} (on ${default_branch})"

          owner="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/ironclaw-controlplane"

          # 2) Dockerfile presence at that commit — via the contents API, no checkout. A
          #    commit without it (older release chaining in, or a revert) → present=false
          #    and the build/merge jobs skip cleanly: "nothing to publish", not a failure.
          if ! gh api "repos/${REPO}/contents/container/controlplane.Dockerfile?ref=${sha}" --silent >/dev/null 2>&1; then
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "No container/controlplane.Dockerfile at ${sha} — skipping image build."
            exit 0
          fi

          # 3) Version: an explicit dispatch input wins; otherwise the release tag this
          #    commit carries, read from the tags API (not a local checkout).
          #
          #    An image tag is an assertion about the source inside it, so a dispatch
          #    input is NOT trusted verbatim: the named tag must exist and must resolve
          #    to the very commit we are about to build. Otherwise the operator's typo
          #    mints :v0.1.403 out of v0.1.404's tree — and because publish-mcp-registry
          #    stamps that ref into an IMMUTABLE MCP Registry version, the lie is not
          #    editable afterwards, only deprecatable. Fail closed instead.
          if [ "${EVENT}" = "workflow_dispatch" ] && [ -n "${INPUT_TAG}" ]; then
            # Strict shape first. This is not just typo-catching: the input becomes an
            # OCI tag, and the API below resolves any REF EXPRESSION, so a loose glob
            # would let `v0.1.403^{commit}` verify against the right commit and then be
            # stamped as the literal tag `v0.1.403^{commit}` — which is not even legal
            # OCI. Only a plain vMAJOR.MINOR.PATCH[-prerelease] gets through.
            if ! printf '%s' "${INPUT_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::Dispatch input tag='${INPUT_TAG}' is not a release tag (expected vMAJOR.MINOR.PATCH, e.g. v0.1.403)." >&2
              exit 1
            fi
            # The commits API takes any ref and always answers with the commit, so this
            # dereferences annotated and lightweight tags alike. An unknown tag is a
            # non-zero exit -> blanked -> refused, so a version that was never released
            # can't be minted. gh prints the error BODY on stdout for a 4xx, hence both
            # the exit-status check and the 40-hex shape check: neither a JSON blob nor
            # an empty string may ever reach the comparison below as a plausible sha.
            if ! tag_sha="$(gh api "repos/${REPO}/commits/${INPUT_TAG}" --jq '.sha' 2>/dev/null)"; then
              tag_sha=""
            fi
            # `[[ =~ ]]` matches the WHOLE string, unlike line-based grep — an error
            # body that merely contained a 40-hex line must not slip through.
            if [[ ! "${tag_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              tag_sha=""
            fi
            if [ -z "${tag_sha}" ]; then
              echo "::error::Dispatch input tag='${INPUT_TAG}' does not exist in ${REPO} — refusing to stamp an image with a version that was never released." >&2
              exit 1
            fi
            if [ "${tag_sha}" != "${sha}" ]; then
              echo "::error::Tag mismatch — refusing to publish an image whose tag names a commit it does not contain." >&2
              echo "::error::  tag ${INPUT_TAG} points at ${tag_sha}" >&2
              echo "::error::  this run is building ${sha}" >&2
              echo "::error::Re-dispatch with 'Use workflow from' set to the tag ${INPUT_TAG} (or to its commit ${tag_sha}); leaving the tag input blank then stamps it automatically." >&2
              exit 1
            fi
            version="${INPUT_TAG}"
            echo "Dispatch tag ${INPUT_TAG} verified against build commit ${sha}."
          else
            version="$(gh api "repos/${REPO}/tags" --paginate \
              --jq ".[] | select(.commit.sha == \"${sha}\") | .name" \
              | grep -E '^v[0-9]' | head -1 || true)"
          fi

          # 3b) Does this build get :latest? Only when it IS the default-branch tip.
          #     :latest must move forwards only. A dispatch rebuild of an older release
          #     (the honest way to repair a mis-stamped :<version>, see IRO-625) builds
          #     an older tree, and unconditionally tagging it :latest would silently
          #     DEMOTE every `docker pull ...:latest` consumer to older code — a far
          #     worse outcome than the mis-tag being repaired. `behind` (an older commit
          #     on the branch) and `ahead`/`diverged` (a dispatch off a side branch) both
          #     publish their immutable :<version> only.
          latest_status="$(gh api "repos/${REPO}/compare/${default_branch}...${sha}" --jq '.status' 2>/dev/null || true)"
          if [ "${latest_status}" = "identical" ]; then
            is_latest=true
          else
            is_latest=false
            echo "Not tagging :latest — ${sha} is '${latest_status:-unknown}' relative to ${default_branch} tip, not that tip."
          fi

          # 3c) The ONE list of tag names this run publishes. Every downstream consumer
          #     (the imagetools -t flags, the MCP image's tag list, the digest lookup in
          #     `merge`, and verify-consumer's pull + attestation checks) is derived from
          #     this, so none of them may assume `latest` is among them — since 3b it is
          #     conditional. IRO-629: `merge` and verify-consumer each hardcoded :latest
          #     and, on the first run where 3b withheld it, silently read a DIFFERENT,
          #     older image's digest.
          #
          #     Order matters: the immutable :<version> comes first so `merge` resolves
          #     the index through the tag that cannot be moved by a concurrent run.
          #     At least one tag is always present — a commit that is neither the tip nor
          #     tagged has nothing meaningful to publish.
          tags=""
          if [ -n "${version}" ]; then
            tags="${version}"
          fi
          if [ "${is_latest}" = "true" ]; then
            tags="${tags:+${tags} }latest"
          fi
          if [ -z "${tags}" ]; then
            echo "::error::${sha} is neither the ${default_branch} tip nor a tagged release — refusing to publish an image with no meaningful tag." >&2
            exit 1
          fi

          # `docker buildx imagetools create` takes the tags as -t flags.
          tag_args=""
          for t in ${tags}; do
            tag_args="${tag_args:+${tag_args} }-t ${image}:${t}"
          done

          # 4) The slim, socket-free MCP-server image (container/mcp.Dockerfile). It is the
          #    artifact the official MCP Registry listing points at (server.json), so it has
          #    to be built and pushed on the same release, from the same commit, under the
          #    same immutable tag. Same present-gate as above: a commit without the
          #    Dockerfile just skips that job rather than failing the release.
          mcp_image="ghcr.io/${owner}/ironclaw-mcp"
          if gh api "repos/${REPO}/contents/container/mcp.Dockerfile?ref=${sha}" --silent >/dev/null 2>&1; then
            # docker/build-push-action takes newline-separated tags. Same tag set as the
            # control-plane image above — both images ship under identical tags so a
            # consumer can pair them by version.
            nl=$'\n'
            mcp_tags=""
            for t in ${tags}; do
              mcp_tags="${mcp_tags}${mcp_tags:+${nl}}${mcp_image}:${t}"
            done
            {
              echo "mcp_present=true"
              echo "mcp_image=${mcp_image}"
              echo "mcp_tags<<__EOF__"
              echo "${mcp_tags}"
              echo "__EOF__"
            } >> "${GITHUB_OUTPUT}"
          else
            echo "mcp_present=false" >> "${GITHUB_OUTPUT}"
            echo "No container/mcp.Dockerfile at ${sha} — skipping the MCP image build."
          fi

          {
            echo "present=true"
            echo "image=${image}"
            echo "version=${version:-dev}"
            echo "tag_args=${tag_args}"
            echo "tags=${tags}"
            echo "sha=${sha}"
          } >> "${GITHUB_OUTPUT}"
          echo "Publishing ${tag_args} (VERSION=${version:-dev}) from ${sha}"

  # Build each arch natively on its own runner and push to GHCR BY DIGEST (no tag).
  # The merge job below assembles these digests into the tagged manifest list.
  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.present == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # checkout the trust-gated commit
      packages: write # push the per-arch image to GHCR by digest
    steps:
      - name: Sanitize platform pair
        id: plat
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "pair=${PLATFORM//\//-}" >> "${GITHUB_OUTPUT}"

      # Check out the commit the prepare job already trust-gated to the protected
      # branch — never the raw event-supplied head_sha. (Dangerous-Workflow: no
      # untrusted checkout in a privileged workflow_run context.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: container/controlplane.Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ needs.prepare.outputs.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          # Push by digest only; the merge job applies the real tags. name-canonical
          # keeps the pushed ref pinned to the digest under the target repo.
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # Per-arch inline attestations off — provenance is attached once to the merged
          # index below (GitHub artifact attestation), matching the release binaries.
          provenance: false
          sbom: false

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ steps.plat.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-arch digests into one manifest list under the real tags, then attach
  # build provenance to the resulting index digest (verify with `gh attestation verify
  # oci://ghcr.io/<owner>/ironclaw-controlplane:<tag>`).
  merge:
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.present == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # read-only; this job does not check out source
      packages: write # push the merged manifest list to GHCR
      id-token: write # keyless provenance + SBOM signing (Sigstore OIDC)
      attestations: write # actions/attest-build-provenance + attest-sbom on the index
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG_ARGS: ${{ needs.prepare.outputs.tag_args }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create ${TAG_ARGS} \
            $(printf "${IMAGE}@sha256:%s " *)

          # The index digest is the verifiable subject of everything downstream: the SLSA
          # provenance attestation, the syft SBOM, verify-consumer's tag check, and the
          # image ref stamped into the (IMMUTABLE) MCP Registry version.
          #
          # It MUST therefore be read back through a tag THIS RUN just pushed. Reading it
          # from a hardcoded :latest was the IRO-629 release-blocker: since IRO-625 moved
          # :latest forwards only, a rebuild of a non-tip commit does not publish :latest,
          # so the inspect silently returned some OTHER, older index — and the run then
          # attested and SBOM-stamped that unrelated image while the release it actually
          # built (v0.1.411) went out with NO provenance at all. Wrong digest here is not
          # a cosmetic slip; it signs a claim about an artifact this run never produced.
          #
          # prepare orders TAGS with the immutable :<version> first, so the lookup goes
          # through the tag a concurrent run cannot move.
          primary="${TAGS%% *}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${primary}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [ -z "${digest}" ]; then
            echo "::error::Could not resolve an index digest for ${IMAGE}:${primary} — refusing to attest an unknown subject." >&2
            exit 1
          fi

          # Every tag we just applied must name that one index. They were created in a
          # single imagetools call so they cannot legitimately diverge; if they have, a
          # concurrent run overwrote one mid-flight and the tags a consumer resolves no
          # longer agree with what we are about to sign. Fail loud rather than attest one
          # digest while :latest serves another.
          for t in ${TAGS}; do
            d="$(docker buildx imagetools inspect "${IMAGE}:${t}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            if [ "${d}" != "${digest}" ]; then
              echo "::error::${IMAGE}:${t} resolves to ${d} but this run published index ${digest} — a concurrent publish moved the tag. Refusing to attest a set whose tags disagree." >&2
              exit 1
            fi
            echo "  ${IMAGE}:${t} -> ${d}"
          done

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Published ${IMAGE} index ${digest} as: ${TAGS}"
          docker buildx imagetools inspect "${IMAGE}@${digest}"

      # Assert the image's own origin labels BEFORE attesting it (IRO-633). A label that
      # nobody checks is decoration; this is what makes org.opencontainers.image.revision
      # load-bearing.
      #
      # The value is baked into the image bytes and is therefore part of the digest, so
      # unlike an attestation subject it cannot be re-pointed after the fact. Checking it
      # against the commit `prepare` trust-gated means the index we are about to sign has
      # to agree, from the inside, about which commit it came from — an independent
      # cross-check on provenance rather than a restatement of it.
      #
      # Same shape as the MCP ownership-label assertion in build-mcp: on a multi-platform
      # index `.Image` is a map keyed by platform, so read the label from EVERY manifest.
      # One arch built without it is still a broken publish. An empty or unreadable label
      # is a FAIL, never a pass.
      - name: Assert the image's revision label matches the built commit
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          WANT_SHA: ${{ needs.prepare.outputs.sha }}
          WANT_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          labels="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format \
            '{{ range $p, $img := .Image }}{{ $p }}={{ index $img.Config.Labels "org.opencontainers.image.revision" }}={{ index $img.Config.Labels "org.opencontainers.image.source" }}
            {{ end }}' | tr -d '\r')"
          seen=0
          bad=0
          while IFS= read -r line; do
            line="$(printf '%s' "${line}" | tr -d '[:space:]')"
            [ -z "${line}" ] && continue
            seen=$((seen + 1))
            plat="${line%%=*}"
            rest="${line#*=}"
            rev="${rest%%=*}"
            src="${rest#*=}"
            echo "  ${plat}: revision=${rev:-<empty>} source=${src:-<empty>}"
            if [ "${rev}" != "${WANT_SHA}" ]; then
              echo "::error::${plat}: org.opencontainers.image.revision='${rev}' does not match the trust-gated build commit '${WANT_SHA}' — refusing to attest an image that disagrees about its own origin." >&2
              bad=1
            fi
            if [ "${src}" != "${WANT_SOURCE}" ]; then
              echo "::error::${plat}: org.opencontainers.image.source='${src}' does not match '${WANT_SOURCE}'." >&2
              bad=1
            fi
          done <<< "${labels}"
          # No manifests read at all means the inspect returned nothing useful; that is an
          # unchecked publish, not a clean one.
          if [ "${seen}" = "0" ]; then
            echo "::error::Read no platform manifests for ${IMAGE}@${DIGEST} — could not verify the origin labels. Failing the release." >&2
            exit 1
          fi
          [ "${bad}" = "0" ] || exit 1
          echo "Origin labels agree with the built commit on all ${seen} platform manifest(s)."

      - name: Attest the control-plane image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      # Per-container-image SBOM (IRO-32 A2). Scan the exact published index by digest
      # with syft → CycloneDX, then attach it as a signed SBOM attestation to the same
      # index digest. Consumers verify it anonymously alongside provenance:
      #   gh attestation verify oci://<image>@<digest> --repo <repo> \
      #     --predicate-type https://cyclonedx.org/bom
      # Pin syft via the SHA-pinned download-syft sub-action instead of
      # `curl …/syft/main/install.sh | sh` (mutable branch piped to a shell).
      # The sub-action installs a fixed syft onto PATH; the scan command is unchanged.
      - name: Install syft (pinned)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Generate image SBOM (syft → CycloneDX)
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          syft version
          # Scan the multi-arch index by its immutable digest (logged into GHCR above).
          syft scan "registry:${IMAGE}@${DIGEST}" \
            -o "cyclonedx-json=${RUNNER_TEMP}/image.cdx.json"

      - name: Attest the image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: ${{ runner.temp }}/image.cdx.json
          push-to-registry: true

  # Build and publish the slim, socket-free MCP-server image (container/mcp.Dockerfile) ->
  # ghcr.io/<owner>/ironclaw-mcp. This is the artifact the official MCP Registry listing
  # points at (server.json), so it MUST ship on the same release, from the same trust-gated
  # commit, under the same immutable tag as the control-plane image — otherwise the listing
  # names an image that does not exist and `publish-mcp-registry` fails closed.
  #
  # Unlike the control-plane image this needs no per-arch native runner: ironctl does not
  # link cgo, so the Go toolchain cross-compiles both arches from one amd64 runner (the
  # Dockerfile pins its build stage to $BUILDPLATFORM and honours $TARGETARCH). One buildx
  # invocation therefore pushes the tagged multi-arch manifest list directly — no
  # push-by-digest + merge dance.
  build-mcp:
    needs: prepare
    if: ${{ needs.prepare.outputs.mcp_present == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout the trust-gated commit
      packages: write # push the image to GHCR
      id-token: write # keyless provenance + SBOM signing (Sigstore OIDC)
      attestations: write # actions/attest-build-provenance + attest-sbom
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # Check out the commit prepare already trust-gated to the protected branch — never
      # the raw event head_sha (Dangerous-Workflow: no untrusted checkout in a job holding
      # packages/attestations write).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the multi-arch MCP image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: container/mcp.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ needs.prepare.outputs.mcp_tags }}
          push: true
          # Provenance is attached once to the index below as a GitHub artifact
          # attestation, matching the control-plane image and the release binaries.
          provenance: false
          sbom: false

      - name: Attest the MCP image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ needs.prepare.outputs.mcp_image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install syft (pinned)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate MCP image SBOM (syft → CycloneDX)
        env:
          IMAGE: ${{ needs.prepare.outputs.mcp_image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          syft version
          syft scan "registry:${IMAGE}@${DIGEST}" \
            -o "cyclonedx-json=${RUNNER_TEMP}/mcp-image.cdx.json"

      - name: Attest the MCP image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ needs.prepare.outputs.mcp_image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/mcp-image.cdx.json
          push-to-registry: true

      # Ownership proof for the MCP Registry: the registry's OCI validator refuses to bind
      # io.github.IronSecCo/ironclaw to an image whose io.modelcontextprotocol.server.name
      # label does not equal the server.json name. Catch a drifted label HERE, next to the
      # build that caused it, instead of three jobs later inside mcp-publisher.
      - name: Assert the MCP Registry ownership label matches server.json
        env:
          IMAGE: ${{ needs.prepare.outputs.mcp_image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          want="$(jq -r '.name' server.json)"
          echo "server.json name: ${want}"
          # On a multi-platform index `.Image` is a map keyed by platform, so read the
          # label from EVERY manifest: one arch built without it is still a broken publish.
          # Emit space-separated "<platform>=<label>" pairs (neither field contains a
          # space) and split on whitespace.
          labels="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format \
            '{{ range $p, $img := .Image }}{{ $p }}={{ index $img.Config.Labels "io.modelcontextprotocol.server.name" }} {{ end }}' \
            | tr -s '[:space:]' '\n')"
          printf '%s\n' "${labels}"
          bad=0
          while IFS= read -r line; do
            [ -z "${line}" ] && continue
            if [ "${line#*=}" != "${want}" ]; then
              echo "::error::${line%%=*}: label io.modelcontextprotocol.server.name='${line#*=}' does not match server.json name '${want}' — the MCP Registry publish would fail closed." >&2
              bad=1
            fi
          done <<< "${labels}"
          [ "${bad}" = "0" ] || exit 1

  # Consumer-side guard. The jobs above PRODUCE the image + attestation; this proves they
  # are CONSUMABLE the way a real user consumes them — anonymously, with no registry
  # credentials. If the GHCR package is (or silently reverts to) private, or its tag no
  # longer resolves to the attested index, or the attestation can't be verified from the
  # outside, this FAILS the release instead of shipping a green-but-unpullable set.
  # (fail-loud, fail-closed + verify-before-trust.)
  #
  # Deliberately runs NO docker/login-action and holds only `contents: read` — it must
  # succeed on exactly the unauthenticated path users hit, never on cached runner creds.
  #
  # Runs once per published image. `ironclaw-mcp` gets the same treatment as the
  # control-plane image because the MCP Registry's OCI validator pulls it ANONYMOUSLY: a
  # private or unattested MCP image is a listing that fails closed for every consumer.
  verify-consumer:
    needs: [prepare, merge, build-mcp]
    if: ${{ needs.prepare.outputs.present == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ${{ needs.prepare.outputs.image }}
            digest: ${{ needs.merge.outputs.digest }}
          - image: ${{ needs.prepare.outputs.mcp_image }}
            digest: ${{ needs.build-mcp.outputs.digest }}
    permissions:
      contents: read # gh attestation verify reads the public attestation; no push/sign here
    env:
      IMAGE: ${{ matrix.image }}
      # Exactly the tags this run published — NOT a hardcoded "latest" plus a
      # version-derived one. :latest is conditional since IRO-625, so asserting it here
      # made the release fail on a tag the run had deliberately not moved (IRO-629).
      # This replaces the old VERSION input: derive tags from here, never recompute them.
      TAGS: ${{ needs.prepare.outputs.tags }}
      EXPECTED_DIGEST: ${{ matrix.digest }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # A matrix entry is empty when its Dockerfile was absent at this commit (the
      # present-gate in `prepare`), e.g. a revert. Skip that entry explicitly rather than
      # verifying an empty image ref — and log it, so a skip is never silent.
      - name: Resolve this matrix entry
        id: gate
        run: |
          set -euo pipefail
          if [ -z "${IMAGE}" ]; then
            echo "::notice::No image for this matrix entry at this commit — nothing to verify."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Verifying ${IMAGE} (expected index ${EXPECTED_DIGEST:-<none>})"
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Anonymous manifest pull (no registry auth)
        if: ${{ steps.gate.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          # IMAGE is already lowercased by prepare; strip the registry host to get the
          # GHCR repository path used by the registry v2 API.
          repo="${IMAGE#ghcr.io/}"

          # Check exactly the tags this run published, as prepare recorded them. A tag we
          # deliberately did NOT move (:latest on a non-tip rebuild) still points at some
          # other release's index, so asserting it against this run's digest would fail a
          # perfectly good publish — and, worse, passing it would mean the digest we are
          # holding came from that other image (IRO-629).
          tags="${TAGS}"
          if [ -z "${tags}" ]; then
            echo "::error::prepare published no tags — nothing to verify, which should be impossible. Failing the release." >&2
            exit 1
          fi
          echo "Tags published by this run: ${tags}"

          # GHCR anonymous pull flow: request a bearer token with NO credentials. For a
          # PUBLIC package that token carries pull scope. For a PRIVATE package — or one
          # that does not exist yet — GHCR refuses to distinguish the two and denies the
          # TOKEN REQUEST ITSELF with 403 DENIED; execution never reaches the manifest
          # fetch. So this request must not use `curl -f`: under `set -e` that aborts the
          # step with a bare `curl: (56)` and the remediation below never prints, which is
          # the one failure this guard exists to explain. Retry first — GHCR is eventually
          # consistent right after a push, so a brief denial is not proof of private.
          tok_body="$(mktemp)"
          tok_code=""
          token=""
          for attempt in 1 2 3 4 5; do
            tok_code="$(curl -sSL -o "${tok_body}" -w '%{http_code}' \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull" || true)"
            token="$(jq -r '.token // empty' <"${tok_body}" 2>/dev/null || true)"
            [ "${tok_code}" = "200" ] && [ -n "${token}" ] && break
            token=""
            echo "  token attempt ${attempt}: HTTP ${tok_code}, retrying in 10s..."
            sleep 10
          done
          if [ -z "${token}" ]; then
            pkg="${repo##*/}"
            owner="${repo%%/*}"
            echo "::error::Anonymous GHCR pull token for ${repo} was denied (HTTP ${tok_code}) after 5 attempts. This is NOT an expected gate — both packages are public today and this job passes for both, so treat it as a real failure. GHCR returns the same denial for a PRIVATE package and for one that was NEVER PUSHED, so settle which it is first: 'gh api /orgs/${owner}/packages/container/${pkg}' answers 404 when the package does not exist, and 200/403 when it does. If it exists, it is private, and an org admin must flip it: ${owner} -> Packages -> ${pkg} -> Package settings -> Change visibility -> Public, then re-run this workflow (GITHUB_TOKEN cannot do it; there is no REST endpoint for container-package visibility, it is a UI action). Runbook: runbooks/mcp-registry.md, section 'Package visibility'. Failing the release." >&2
            exit 1
          fi

          accept='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
          for tag in ${tags}; do
            echo "Anonymous manifest pull: ghcr.io/${repo}:${tag}"
            # GHCR is eventually consistent right after a push; retry a few times before
            # failing so a propagation lag is not mistaken for a private package.
            code=""
            hdr="$(mktemp)"
            for attempt in 1 2 3 4 5; do
              code="$(curl -s -D "${hdr}" -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer ${token}" \
                -H "Accept: ${accept}" \
                "https://ghcr.io/v2/${repo}/manifests/${tag}")"
              [ "${code}" = "200" ] && break
              echo "  attempt ${attempt}: HTTP ${code}, retrying in 10s..."
              sleep 10
            done
            if [ "${code}" != "200" ]; then
              echo "::error::Anonymous pull of ghcr.io/${repo}:${tag} returned HTTP ${code} (expected 200) — the package is not anonymously pullable (likely private). Failing the release." >&2
              exit 1
            fi
            echo "  -> HTTP 200 (anonymously pullable)"
            # The tag a public consumer resolves must be exactly the index we attested.
            # Every tag in the loop is one THIS run pushed, so a mismatch is real: either
            # a concurrent publish moved it, or the digest we attested was never the one
            # behind this tag. Both are fail-closed, and an absent header is too — a check
            # that cannot read the digest has not passed, it has been skipped.
            pulled="$(grep -i '^docker-content-digest:' "${hdr}" | tr -d '\r' | awk '{print $2}')"
            if [ -z "${pulled}" ]; then
              echo "::error::ghcr.io/${repo}:${tag} returned no Docker-Content-Digest header — cannot confirm it resolves to the attested index. Failing the release." >&2
              exit 1
            fi
            if [ -n "${EXPECTED_DIGEST}" ] && [ "${pulled}" != "${EXPECTED_DIGEST}" ]; then
              echo "::error::ghcr.io/${repo}:${tag} resolves to ${pulled} but the just-published index digest is ${EXPECTED_DIGEST} — mismatch. Failing the release." >&2
              exit 1
            fi
            echo "  -> ${pulled} (matches the attested index)"
          done

      - name: Verify build provenance from the consumer side
        if: ${{ steps.gate.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          # Verify by digest (the attested subject) and by the tags users actually pull —
          # again exactly the tags this run published, never a hardcoded :latest.
          # No registry login above means this exercises the genuine anonymous OCI path.
          refs=""
          if [ -n "${EXPECTED_DIGEST}" ]; then
            refs="oci://${IMAGE}@${EXPECTED_DIGEST}"
          fi
          for tag in ${TAGS}; do
            refs="${refs:+${refs} }oci://${IMAGE}:${tag}"
          done
          for ref in ${refs}; do
            echo "gh attestation verify ${ref} --repo ${REPO}"
            # gh queries the public attestations API right after publish; brief retry to
            # absorb indexing lag, then fail loud if it still cannot verify.
            ok=""
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "${ref}" --repo "${REPO}"; then
                ok="yes"; break
              fi
              echo "  attempt ${attempt}: not yet verifiable, retrying in 10s..."
              sleep 10
            done
            if [ -z "${ok}" ]; then
              echo "::error::Attestation for ${ref} did not verify from the consumer side. Failing the release." >&2
              exit 1
            fi
          done

      # Post-publish provenance gate (IRO-633 / IRO-640). The step above proves that AN
      # attestation on this digest verifies. This proves the RIGHT one — and only it — is
      # bound to what this run just pushed.
      #
      # `gh attestation verify` is MONOTONIC BY DESIGN: silent on success, and exit 0 as
      # soon as ANY ONE statement verifies, with the remaining results discarded
      # (cli/cli#9850; GitHub's stated threat is a MALFORMED extra statement, not a valid
      # contradicting one). So a digest carrying a second, perfectly valid provenance
      # minted by a run that built something else sails through it green.
      #
      # That is not hypothetical here. ghcr.io/ironsecco/ironclaw-controlplane
      # @sha256:be66da22455e11b8625693a29535f599500c126165eeabb34775492a962ce5b7 — ONE
      # digest carried on TWO tags (:v0.1.407 and :latest), not two incidents — holds two
      # SLSA provenance statements, from runs 30409777856 and 30412119358, the second
      # Rekor-logged 44 minutes AFTER the digest already existed. It came from `merge`
      # reading the index digest back through a hardcoded :latest that this run had
      # deliberately not moved, then attesting an index it never built (IRO-629). The
      # attestation log is append-only and a tag move or package delete retracts NOTHING
      # (IRO-632), so that image is permanently ambiguous. The only place this is
      # catchable is here, in the publisher's own CI, while the set of statements is still
      # authoritative — never in consumer admission control, where a non-monotonic rule
      # can be disarmed by whoever can add statements.
      #
      # FAIL CLOSED. The ONLY path to green is an affirmative count of exactly 1, whose
      # subject is this image at this digest, and whose invocationId is THIS run. A query
      # that errors, returns empty, returns null, or returns a non-array all FAIL. Note
      # `jq length` prints an EMPTY STRING for an unreadable body, and empty-read-as-pass
      # is precisely how release gates have false-passed in this repo before — so every
      # read below is shape-checked against ^[0-9]+$ or asserted with `jq -e`, and nothing
      # is ever tested for mere truthiness.
      - name: Assert exactly one provenance statement, minted by this run for this digest
        if: ${{ steps.gate.outputs.skip != 'true' }}
        run: |
          set -euo pipefail

          # A gate with no subject has not passed, it has been skipped.
          if [ -z "${EXPECTED_DIGEST}" ]; then
            echo "::error::No published index digest for ${IMAGE} — refusing to green a provenance gate that had nothing to check. Failing the release." >&2
            exit 1
          fi

          out="$(mktemp)"
          err="$(mktemp)"
          if ! gh attestation verify "oci://${IMAGE}@${EXPECTED_DIGEST}" \
                --repo "${REPO}" --format json >"${out}" 2>"${err}"; then
            echo "::error::Could not read provenance statements for ${IMAGE}@${EXPECTED_DIGEST} — the query itself failed, which is a FAIL, not a pass. Failing the release." >&2
            cat "${err}" >&2 || true
            exit 1
          fi

          # Affirmative integer, or refuse. A non-array body yields -1, which fails the
          # shape check below alongside the empty string an unreadable body produces.
          count="$(jq 'if type == "array" then length else -1 end' "${out}" 2>/dev/null || true)"
          if ! printf '%s' "${count}" | grep -Eq '^[0-9]+$'; then
            echo "::error::Could not read a provenance statement count for ${IMAGE}@${EXPECTED_DIGEST} (got '${count}') — an unreadable answer is a FAIL. Failing the release." >&2
            exit 1
          fi

          if [ "${count}" != "1" ]; then
            echo "::error title=Provenance statement count is ${count}, expected exactly 1::${IMAGE}@${EXPECTED_DIGEST} carries ${count} SLSA provenance statements. 0 means this run published an image with no provenance at all. 2 or more means the digest is claimed by more than one build, so a consumer running 'gh attestation verify' gets whichever statement happens to verify first and cannot tell which build really produced this image (IRO-633). Do NOT re-run to clear this: the attestation log is append-only and nothing retracts a statement (IRO-632). Investigate which run minted each statement below, fix the publisher, and cut a new release. Failing the release." >&2
            jq -r '.[] | "  run=\(.verificationResult.statement.predicate.runDetails.metadata.invocationId // "<unknown>") subject=\(.verificationResult.statement.subject // [] | map("\(.name)@sha256:\(.digest.sha256 // "?")") | join(","))"' \
              "${out}" >&2 || true
            exit 1
          fi

          # The one statement must name THIS image at THIS digest.
          # actions/attest-build-provenance takes subject-digest as a free-form input and
          # signs whatever it is handed — nothing in the action binds that digest to what
          # the run actually built. This assertion is that missing binding.
          want_hex="${EXPECTED_DIGEST#sha256:}"
          if ! jq -e --arg img "${IMAGE}" --arg hex "${want_hex}" \
              '(.[0].verificationResult.statement.subject // [])
                 | map(select(.name == $img and .digest.sha256 == $hex)) | length == 1' \
              "${out}" >/dev/null 2>&1; then
            echo "::error::The provenance statement on ${IMAGE}@${EXPECTED_DIGEST} does not name that image and digest as its subject — refusing to ship an image whose provenance describes something else. Failing the release." >&2
            jq -r '.[0].verificationResult.statement.subject' "${out}" >&2 || true
            exit 1
          fi

          # ...and it must have been minted by THIS run. This is the assertion IRO-629
          # would have tripped: that run attested an older index it had not built, so the
          # provenance on the digest it shipped came from a different run entirely.
          # invocationId is a run URL ending .../actions/runs/<id>/attempts/<n>; normalize
          # to the run id. `// empty` yields an empty string for a JSON null, which the
          # shape check below rejects — never compare against the literal "null".
          claim_url="$(jq -r '.[0].verificationResult.statement.predicate.runDetails.metadata.invocationId // empty' "${out}" 2>/dev/null || true)"
          claim_run="$(printf '%s' "${claim_url}" | sed -E 's#.*/actions/runs/([0-9]+).*#\1#')"
          if ! printf '%s' "${claim_run}" | grep -Eq '^[0-9]+$'; then
            echo "::error::Could not read the run that minted the provenance for ${IMAGE}@${EXPECTED_DIGEST} (invocationId='${claim_url}') — an unreadable answer is a FAIL. Failing the release." >&2
            exit 1
          fi
          if [ "${claim_run}" != "${GITHUB_RUN_ID}" ]; then
            echo "::error::Provenance on ${IMAGE}@${EXPECTED_DIGEST} was minted by run ${claim_run}, but this run is ${GITHUB_RUN_ID} — this run published a digest it did not attest, or attested one it did not publish (IRO-629). Failing the release." >&2
            exit 1
          fi

          echo "  ${IMAGE}@${EXPECTED_DIGEST}: exactly 1 provenance statement, subject matches, minted by run ${claim_run}."

      # Post-publish cosign-carrier gate (IRO-648). The step above reads GitHub Artifact
      # Attestations and NOTHING ELSE, so it sees exactly one of the three carriers an
      # attestation can travel in. That is the same defect class as the incident it exists
      # to catch: asserting a property of a SUBSET and reporting it as a property of the
      # artifact.
      #
      # The gap is not theoretical. Attestations reach consumers three ways (IRO-645):
      #   1. BuildKit inline — part of the index digest, so a conflicting statement cannot
      #      be appended. We publish none of these (`provenance: false` at :425 and :667,
      #      deliberately: per-arch inline attestations do not describe the merged index).
      #   2. cosign's fallback tag scheme, `sha256-<digest-hex>.{att,sig,sbom}` — an
      #      ORDINARY MUTABLE TAG. GHCR does not implement the OCI referrers API (404 on
      #      every GHCR repo we probed, including ones holding real cosign artifacts), so
      #      on GHCR this scheme IS the registry-side carrier.
      #   3. GitHub Artifact Attestations — what the step above reads.
      #
      # Anyone with push access to our packages can `cosign attest` a digest we already
      # published. `slsa-verifier verify-image` reads ONLY carrier 2 and cannot see
      # carrier 3 at all, so it would show a consumer ONLY the forged statement while the
      # gate above stayed green. Carrier 3 is append-only; carrier 2 is not, which makes
      # the registry side strictly weaker and strictly easier to plant on.
      #
      # We publish nothing through carrier 2 — no cosign step anywhere in this workflow —
      # so the correct assertion is absence, and any presence is unexplained by our own
      # pipeline. Confirmed clean when this landed: a full paginated tags/list sweep of
      # both packages (362 and 21 tags, every HTTP status audited) returned zero
      # `sha256-*.{att,sig,sbom}`, so a fire here is a finding, not a pre-existing state.
      #
      # SCOPE, stated honestly rather than overclaimed: this checks the INDEX digest this
      # run published — the digest a consumer's `slsa-verifier verify-image` resolves a
      # multi-arch ref to, which is the sharp case. A carrier tag planted on a per-arch
      # CHILD manifest is out of scope and would not fire here.
      #
      # FAIL CLOSED, and note this is deliberately the OPPOSITE of what IRO-645 recommends
      # to third parties. For them a registry hiccup failing their release from our code is
      # unacceptable, so the advice is warn-by-default with a not-evaluable outcome. For
      # US, an unreadable answer about our own supply chain is a FAIL: 404 is the only
      # thing that clears this gate. 200 means a carrier exists; anything else means we
      # could not tell, and a check that cannot read its subject has not passed, it has
      # been skipped.
      - name: Assert no cosign-carrier tag exists for this digest
        if: ${{ steps.gate.outputs.skip != 'true' }}
        run: |
          set -euo pipefail

          # A gate with no subject has not passed, it has been skipped.
          if [ -z "${EXPECTED_DIGEST}" ]; then
            echo "::error::No published index digest for ${IMAGE} — refusing to green a cosign-carrier gate that had nothing to check. Failing the release." >&2
            exit 1
          fi

          repo="${IMAGE#ghcr.io/}"
          hex="${EXPECTED_DIGEST#sha256:}"
          if ! printf '%s' "${hex}" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::Published digest for ${IMAGE} is '${EXPECTED_DIGEST}', which is not a sha256 hex digest — cannot construct the cosign fallback tag to check. Failing the release." >&2
            exit 1
          fi

          # Anonymous pull token, exactly as the manifest-pull step above mints it: this
          # must exercise the path an outside verifier walks, not cached runner creds.
          # Not `curl -f` — under `set -e` that aborts with a bare `curl: (56)` and the
          # remediation never prints, which is the one failure this guard exists to
          # explain (IRO-624).
          tok_body="$(mktemp)"
          tok_code=""
          token=""
          for attempt in 1 2 3 4 5; do
            tok_code="$(curl -sSL -o "${tok_body}" -w '%{http_code}' \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull" || true)"
            token="$(jq -r '.token // empty' <"${tok_body}" 2>/dev/null || true)"
            [ "${tok_code}" = "200" ] && [ -n "${token}" ] && break
            token=""
            echo "  token attempt ${attempt}: HTTP ${tok_code}, retrying in 10s..."
            sleep 10
          done
          if [ -z "${token}" ]; then
            echo "::error::Anonymous GHCR pull token for ${repo} was denied (HTTP ${tok_code}) after 5 attempts, so the cosign-carrier tags could not be checked. An unreadable answer is a FAIL, not a pass. Failing the release." >&2
            exit 1
          fi

          accept='application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json'
          found=""
          for suffix in att sig sbom; do
            tag="sha256-${hex}.${suffix}"
            # 404 is a definitive absence and needs no retry. Retry only the codes that
            # mean "ask again" (throttling / transient registry errors); every other
            # non-404, non-200 answer is unreadable and therefore a failure.
            code=""
            for attempt in 1 2 3 4 5; do
              code="$(curl -s -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer ${token}" \
                -H "Accept: ${accept}" \
                "https://ghcr.io/v2/${repo}/manifests/${tag}" || true)"
              case "${code}" in
                200|404) break ;;
              esac
              echo "  ${tag} attempt ${attempt}: HTTP ${code}, retrying in 10s..."
              sleep 10
            done

            case "${code}" in
              404)
                echo "  ${repo}:${tag} -> HTTP 404 (absent, as expected)"
                ;;
              200)
                echo "::error title=Unexpected cosign carrier tag ${tag}::${IMAGE}@${EXPECTED_DIGEST} carries a cosign fallback tag '${tag}', but this pipeline publishes no cosign artifacts at all — nothing in this workflow creates one. Someone with push access to ${repo} attached it to a digest we published. This matters because 'slsa-verifier verify-image' and 'cosign verify-attestation' read ONLY this carrier and cannot see GitHub Artifact Attestations, so a consumer would be shown a statement we never made while our own attestation gate stayed green (IRO-645/IRO-648). Inspect it with 'crane manifest ghcr.io/${repo}:${tag}' and 'cosign download attestation ${IMAGE}@${EXPECTED_DIGEST}', treat the push credential as compromised, and do NOT simply delete the tag and re-run: settle who pushed it first. Failing the release." >&2
                found="yes"
                ;;
              *)
                echo "::error::Could not determine whether ${repo}:${tag} exists (HTTP ${code} after retries) — an unreadable answer is a FAIL, not a pass. Failing the release." >&2
                exit 1
                ;;
            esac
          done

          if [ -n "${found}" ]; then
            exit 1
          fi

          echo "  ${IMAGE}@${EXPECTED_DIGEST}: no cosign carrier tag (.att/.sig/.sbom) present."

  # Publish (or refresh) the IronClaw listing on the official MCP Registry
  # (registry.modelcontextprotocol.io) under the account-free `io.github.IronSecCo`
  # namespace. This runs ONLY after the image is built, merged, attested, AND proven
  # anonymously pullable by verify-consumer — the registry's OCI validator fetches the
  # image and requires the `io.modelcontextprotocol.server.name` label to match the
  # server.json name, so a private or unlabelled image would fail-close here rather than
  # half-list. Skipped on untagged commits (VERSION=dev): we list immutable releases only.
  #
  # Trust anchors: namespace ownership is proven by THIS repo's GitHub Actions OIDC token
  # (id-token: write, no long-lived secret); the mcp-publisher binary is pinned by version
  # AND sha256 AND cosign-verified against the registry repo's release provenance before it
  # runs. A publish failure fails the workflow (fail-loud) but never rolls back the already
  # -published, already-attested image — the listing points at an artifact that stands on
  # its own.
  #
  # UNPARKED 2026-07-29 (IRO-612). This job was hard-gated to a manual dispatch while the
  # listing still described option A — the control-plane image launched over a host Docker
  # socket, which the CEO rejected as host-root (IRO-391). The blocker is gone: IRO-414
  # shipped container/mcp.Dockerfile and `build-mcp` above now publishes the socket-free
  # `ironclaw-mcp` thin client, which is what server.json points at. So the listing this
  # job publishes is now the trust model we actually endorse, and it runs on the release
  # path again. The manual `publish_mcp_registry` input survives only as a way to force a
  # re-publish from a dispatch; it is NOT required on the release path.
  #
  # The already-published option-A versions (0.1.216–0.1.230) stay `deprecated` on the
  # registry — they name an image we still tell people not to run. Do not blanket-activate
  # them (see runbooks/mcp-registry.md).
  publish-mcp-registry:
    needs: [prepare, merge, build-mcp, verify-consumer]
    # Tagged releases only (VERSION != dev): we list immutable versions. A manual dispatch
    # must additionally opt in via publish_mcp_registry so a routine rebuild does not
    # re-publish a listing by accident.
    if: ${{ needs.prepare.outputs.present == 'true' && needs.prepare.outputs.mcp_present == 'true' && needs.prepare.outputs.version != 'dev' && needs.prepare.outputs.version != '' && (github.event_name != 'workflow_dispatch' || inputs.publish_mcp_registry) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout the trust-gated commit to read server.json
      id-token: write # OIDC token that proves io.github.IronSecCo namespace ownership
    env:
      # Pinned mcp-publisher release. Bump all three in lock-step (see runbooks/mcp-registry.md).
      MCP_PUBLISHER_VERSION: v1.7.9
      MCP_PUBLISHER_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
      # Sigstore identity that signed the pinned mcp-publisher release archive.
      MCP_PUBLISHER_CERT_IDENTITY: https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/v1.7.9
      MCP_PUBLISHER_CERT_ISSUER: https://token.actions.githubusercontent.com
      # The listing points at the socket-free MCP image, NOT the control-plane image.
      IMAGE: ${{ needs.prepare.outputs.mcp_image }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SERVER_NAME: io.github.IronSecCo/ironclaw
      REGISTRY: https://registry.modelcontextprotocol.io
    steps:
      # Check out the commit prepare already trust-gated to the protected branch — never
      # the raw event head_sha (Dangerous-Workflow: no untrusted checkout while holding
      # id-token: write).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download + verify mcp-publisher (pinned version, sha256, cosign provenance)
        run: |
          set -euo pipefail
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          asset="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL "${base}/${asset}" -o "${asset}"
          curl -fsSL "${base}/${asset}.sigstore.json" -o "${asset}.sigstore.json"

          # 1) Exact-digest pin: the archive must be the byte-for-byte one we reviewed.
          echo "${MCP_PUBLISHER_SHA256}  ${asset}" | sha256sum -c -

          # 2) Provenance pin: the archive must be signed by the registry repo's own
          #    release workflow (keyless Sigstore). Fail closed on any identity mismatch.
          cosign verify-blob \
            --bundle "${asset}.sigstore.json" \
            --certificate-identity "${MCP_PUBLISHER_CERT_IDENTITY}" \
            --certificate-oidc-issuer "${MCP_PUBLISHER_CERT_ISSUER}" \
            "${asset}"

          tar xzf "${asset}" mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version || true

      - name: Stamp the release version into server.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The MCP registry version is semver — strip the leading v from our vX.Y.Z tag.
          semver="${VERSION#v}"
          # Pin the OCI package to THIS release's immutable image tag (never :latest), so
          # the listing is re-derivable from the tagged commit (reproducibility/provenance).
          oci_ref="${IMAGE}:${VERSION}"
          tmp="$(mktemp)"
          jq --arg v "${semver}" --arg ref "${oci_ref}" \
            '.version = $v | .packages[0].identifier = $ref' \
            server.json > "${tmp}"
          mv "${tmp}" server.json
          echo "Stamped server.json -> version=${semver}, package=${oci_ref}"
          cat server.json

      - name: Validate server.json against the registry schema
        run: ./mcp-publisher validate server.json

      - name: Authenticate to the MCP Registry via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish the IronClaw listing
        run: ./mcp-publisher publish

      # The server was deprecated SERVER-WIDE on 2026-07-07 (every option-A version
      # launched IronClaw over a host Docker socket). A freshly published version should
      # land `active` on its own, but after a server-wide deprecation do not TRUST that —
      # assert it, and self-heal with a PER-VERSION status PATCH.
      #
      # Deliberately NOT the server-wide `PATCH /v0/servers/{name}/status` that
      # mcp-registry-deprecate.yml drives: that flips EVERY version in one transaction and
      # would resurrect 0.1.216–0.1.230, which name the socket-mount image and must stay
      # deprecated permanently (IRO-391 / IRO-613). No operator is ever asked to run it.
      #
      # `status <name> <version>` (no --all-versions) is exactly
      # `PATCH /v0/servers/{name}/versions/{version}/status` with body {"status":"active"} —
      # scoped to the one version we just published. It reuses the login above and the same
      # cosign-verified pinned binary, so this adds no trust surface and no token handling
      # of our own. It omits statusMessage, which the API rejects when status=active.
      #
      # SELF-HEAL, NOT UNCONDITIONAL WRITE. The registry rejects a status PATCH that would
      # change nothing with `400 No changes to apply: status and message are already set to
      # the provided values`. A freshly published version normally DOES land `active` by
      # itself, so an unconditional PATCH 400s on exactly the happy path — that is what
      # failed the v0.1.404 relight run after its publish had already succeeded. Read the
      # per-version status first and only write when it actually needs correcting.
      - name: Ensure this version is active on the registry
        run: |
          set -euo pipefail
          semver="${VERSION#v}"
          enc="$(jq -rn --arg s "${SERVER_NAME}" '$s|@uri')"
          status="$(curl -fsSL "${REGISTRY}/v0/servers/${enc}/versions" \
            | jq -r --arg n "${SERVER_NAME}" --arg v "${semver}" \
              'first(.servers[]? | select(.server.name == $n and .server.version == $v)
                 | ._meta["io.modelcontextprotocol.registry/official"].status) // "unknown"')"

          if [ "${status}" = "active" ]; then
            echo "${SERVER_NAME} ${semver} already published active — no status PATCH needed."
            exit 0
          fi

          echo "${SERVER_NAME} ${semver} is '${status}' — self-healing to active."
          # NEVER pass --all-versions here: that is the server-wide PATCH and it would
          # resurrect 0.1.216-0.1.230 (see the note above).
          if out="$(./mcp-publisher status --status active "${SERVER_NAME}" "${semver}" 2>&1)"; then
            printf '%s\n' "${out}"
          else
            printf '%s\n' "${out}"
            # Tolerate ONLY the idempotent no-op: the version flipped to active between the
            # read above and this write. Any other failure is a real one — fail closed.
            printf '%s' "${out}" | grep -q 'No changes to apply' \
              || { echo "::error::status PATCH failed for ${SERVER_NAME} ${semver}." >&2; exit 1; }
            echo "Version was already active by the time the PATCH landed — treating as a no-op."
          fi

      - name: Verify the listing resolves on the registry and is active
        run: |
          set -euo pipefail
          semver="${VERSION#v}"
          # Fail-closed post-check. Query the EXACT per-server versions endpoint, not
          # `?search=` — search is fuzzy and the response nests the record under `.server`,
          # so the old `.servers[].name` match could never hit. That mismatch is what
          # false-failed this job in 2026-07 while the publish itself had succeeded.
          enc="$(jq -rn --arg s "${SERVER_NAME}" '$s|@uri')"
          url="${REGISTRY}/v0/servers/${enc}/versions"
          ok=""
          body=""
          for attempt in 1 2 3 4 5; do
            body="$(curl -fsSL "${url}" || true)"
            # active AND isLatest: an active version that is not the latest is still a dark
            # listing, because clients resolve the latest one.
            if printf '%s' "${body}" | jq -e --arg n "${SERVER_NAME}" --arg v "${semver}" \
              '.servers[]? | select(.server.name == $n and .server.version == $v)
                           | select(._meta["io.modelcontextprotocol.registry/official"].status == "active")
                           | select(._meta["io.modelcontextprotocol.registry/official"].isLatest == true)' \
              >/dev/null 2>&1; then
              ok="yes"; break
            fi
            echo "  attempt ${attempt}: ${SERVER_NAME} ${semver} not yet active+isLatest, retrying in 10s..."
            sleep 10
          done
          # A published-but-deprecated listing is worse than none: clients surface it with a
          # warning and users read it as "abandoned". Fail loud with the exact remediation.
          if [ -z "${ok}" ]; then
            echo "::error::${SERVER_NAME} ${semver} is not active+isLatest on registry.modelcontextprotocol.io after publish. Failing the release. See runbooks/mcp-registry.md." >&2
            printf '%s' "${body}" | jq '[.servers[]? | {version: .server.version, status: ._meta["io.modelcontextprotocol.registry/official"].status, isLatest: ._meta["io.modelcontextprotocol.registry/official"].isLatest}]' || true
            exit 1
          fi
          echo "Listing live and active: ${SERVER_NAME} ${semver} -> ${IMAGE}:${VERSION}"
