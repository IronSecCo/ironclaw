# Build the MkDocs (Material) documentation site and publish it to GitHub Pages.
#
# - On pull requests: build only (with --strict), as a CI gate. No deploy.
# - On push to main: build + deploy to GitHub Pages.
#
# Least-privilege: the default token is read-only; only the deploy job is granted
# the pages/id-token scopes the GitHub Pages OIDC deployment needs.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "*.md"
      - "mkdocs.yml"
      - "overrides/**"
      - "api/openapi.yaml"
      - "scripts/check-docs-meta.py"
      - "scripts/check_links.py"
      - "scripts/check-guide-index.py"
      - "scripts/check-guide-uid.py"
      - "scripts/check-md-fences.py"
      # check-guide-uid.py reads `hardenedUID` out of this file, so a change to
      # the constant has to trigger this workflow too. Without it, moving the
      # constant would leave 56 guides quoting the old uid and nothing in CI
      # would ever look: the paths filter, not the check, would be the hole.
      - "internal/host/scan/remediate.go"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "*.md"
      - "mkdocs.yml"
      - "overrides/**"
      - "api/openapi.yaml"
      - "scripts/check-docs-meta.py"
      - "scripts/check_links.py"
      - "scripts/check-guide-index.py"
      - "scripts/check-guide-uid.py"
      - "scripts/check-md-fences.py"
      # check-guide-uid.py reads `hardenedUID` out of this file, so a change to
      # the constant has to trigger this workflow too. Without it, moving the
      # constant would leave 56 guides quoting the old uid and nothing in CI
      # would ever look: the paths filter, not the check, would be the hole.
      - "internal/host/scan/remediate.go"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two Pages deploys at once; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hooks.py derives the version from `git rev-list --count HEAD`.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check markdown code fences are intact
        # Nothing else in CI reads markdown *structure*. PR #656 proved the cost:
        # it deleted the two fences wrapping the sample `ironctl scan --md`
        # output in docs/blog/audit-your-sandbox-in-10-seconds.md, and all 17
        # checks went green while the page started rendering that literal sample
        # as a real `###` heading (which entered the nav) and a real table.
        # `mkdocs build --strict` does not care, and neither does anything below.
        #
        # Two rules: an unclosed fence, and -- the one that actually catches
        # #656, which left the file perfectly balanced -- a two-blank run outside
        # a fenced block, which is the trace a *deleted* fence leaves behind.
        # A step in `build` for the same reason as the checks around it: `build`
        # is the required check on ruleset 17917971 and a new job name would not
        # be. Stdlib only, so it runs before the toolchain install and fails
        # fast. Negative controls: scripts/tests/test_check_md_fences.py (run by
        # ci.yml script-tests), including a fixture of #656's exact pre-fix bytes
        # and an assertion that a balance-only guard is green on it. See IRO-707.
        run: python3 scripts/check-md-fences.py

      - name: Check root Markdown links and anchor fragments
        # Root Markdown (README.md, CONTRIBUTING.md, SECURITY.md, ...) is not part
        # of the MkDocs source tree, so `mkdocs build --strict` below cannot see a
        # single one of its links. This is the only thing in CI that checks them.
        # It also runs on docs/** changes, because renaming a heading under docs/
        # silently breaks the root files that deep-link into it
        # (SECURITY.md -> docs/threat-model.md#8-what-counts-as-a-vulnerability).
        #
        # A step in this job rather than a job of its own, deliberately: `build`
        # is a required status check on ruleset 17917971 and a new job name would
        # not be, so a red `links` job could be merged straight past. Same reason
        # check-docs-meta.py lives here. Stdlib only, so it runs before the
        # toolchain install and fails fast. Negative controls that prove it is not
        # vacuous: scripts/tests/test_check_links.py (run by ci.yml script-tests).
        # The other half of the gate is validation.links.anchors in mkdocs.yml,
        # which covers docs/** against the real rendered heading tree.
        run: python3 scripts/check_links.py

      - name: Check every hardening guide is wired into its indexes
        # A guide missing from an index is not a broken link, so neither
        # check_links.py nor `mkdocs build --strict` can see it: both only follow
        # links that already exist. IRO-696 is what that costs -- an outside
        # contributor found harden-haproxy missing from docs/blog/index.md by
        # hand, and the sweep that followed showed the drift ran to 40 guides.
        # This asserts presence on the two surfaces that claim to be exhaustive
        # (the nav and the hub); index.md and README.md are curated prose and are
        # deliberately out of scope, see the module docstring. A step in `build`
        # for the same reason as the two checks around it: `build` is the
        # required check on ruleset 17917971 and a new job name would not be.
        # Stdlib only, so it runs before the toolchain install and fails fast.
        # Negative controls: scripts/tests/test_check_guide_index.py (ci.yml).
        run: python3 scripts/check-guide-index.py

      - name: Check the guides quote the uid `--fix` actually emits
        # Every harden-*.md heads its remediation section "the exact `--fix`
        # remediation", so the flags under it are a claim about our own tool's
        # output. Twice that claim was false and both times a human reading the
        # page caught it, not CI: IRO-698 shipped a guide whose bullet and run
        # block pinned different uids, and the IRO-699 sweep found 17 guides
        # quoting a uid --fix never emits (couchdb and neo4j had reused the
        # image's port number as a uid). A wrong-but-well-formed number inside a
        # code fence is invisible to check_links.py, check-guide-index.py and
        # `mkdocs build --strict` alike: none of them read prose, only links,
        # nav wiring and front-matter.
        #
        # The uid is read out of internal/host/scan/remediate.go, so the
        # assertion follows the constant instead of being a second place to
        # remember; that file is in this workflow's paths filter for the same
        # reason. A step in `build` for the same reason as the checks around it:
        # `build` is the required check on ruleset 17917971 and a new job name
        # would not be. Stdlib only, so it runs before the toolchain install and
        # fails fast. Negative controls: scripts/tests/test_check_guide_uid.py
        # (run by ci.yml script-tests), including the two that assert it stays
        # silent on haproxy/grafana/prometheus, where the uid is the image's own
        # and rewriting it would break the container.
        run: python3 scripts/check-guide-uid.py

      - name: Install MkDocs toolchain (hash-pinned)
        # --require-hashes makes pip refuse any wheel whose SHA-256 isn't in the
        # lockfile, so the published site is built only from byte-for-byte known
        # artifacts. docs/requirements.txt carries --hash= lines (pip-compile
        # --generate-hashes) plus the full transitive closure.
        run: pip install --require-hashes -r docs/requirements.txt

      - name: Build site (strict)
        run: mkdocs build --strict --site-dir _site

      - name: Check published pages carry their own title and description
        # `mkdocs build --strict` gates broken links and nav, but never looks at
        # front-matter, so a page with no title/description builds green and
        # ships the site-wide fallback as its SERP snippet. This asserts on the
        # built HTML (the bytes Google reads), not on docs/**/*.md, so it needs
        # no second copy of the `exclude_docs` patterns and also catches
        # front-matter that is present but silently unparseable. See IRO-617.
        run: python3 scripts/check-docs-meta.py _site

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    # Publish only the main branch; PRs validate the build above but never deploy.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
